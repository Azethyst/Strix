<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in | Strix</title>
    <link rel="icon" type="image/png" href="images/icon.jpg" />
    <link rel="stylesheet" href="/css/login.css?v=6" />
  </head>
  <body>
    <img class="background-image" src="images/wallpaper.jpg" alt="" />
    <div class="login-frame">
      <img class="login-image" src="images/frame.jpg" alt="" />
      <main class="login-content">
        <div class="brand">
          <img src="images/icon.jpg" alt="" />
          <h1><img class="brand-logo" src="/images/logo.jpg" alt="Strix" /></h1>
        </div>
        <h2 id="loginTitle">Sign in</h2>
        <form id="loginForm" action="/api/login" method="post">
          <input
            id="email"
            type="email"
            name="email"
            placeholder="Enter Address"
            autocomplete="email"
            required
          />
          <input
            id="password"
            type="password"
            name="password"
            placeholder="Enter Password"
            autocomplete="current-password"
            hidden
          />
          <p id="loginError" aria-live="polite"></p>

          <button id="nextButton" type="submit">Next</button>
        </form>
        <pre id="apiResponse" aria-live="polite"></pre>
      </main>
    </div>
    <script src="/js/login.js?v=4" defer></script>
  </body>
</html>
